name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clothing_brand
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clothing_brand?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_CUSTOMER_ACCESS_SECRET: ci-customer-access-secret
      JWT_CUSTOMER_REFRESH_SECRET: ci-customer-refresh-secret
      WEB_ORIGIN: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMe123!

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @clothing-brand/shared build

      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Seed admin + demo catalog
        run: pnpm --filter api db:seed

      - name: Typecheck API
        run: pnpm --filter api exec tsc --noEmit -p tsconfig.json

      - name: Typecheck web
        run: pnpm --filter web exec tsc --noEmit -p tsconfig.json

      - name: Run API tests
        run: pnpm --filter api test

      - name: Build web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Start API and web servers
        run: |
          pnpm --filter api exec tsx src/server.ts &
          pnpm --filter web start &
          npx wait-on http://localhost:4000/health http://localhost:3000

      - name: Run Playwright end-to-end tests
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package deploy archive
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude='node_modules' --exclude='.git' --exclude='.next' --exclude='dist' \
            --exclude='.turbo' --exclude='coverage' --exclude='apps/api/.devmail' \
            --exclude='apps/api/uploads' --exclude='apps/api/.env' --exclude='apps/web/.env.local' \
            --exclude='*.tsbuildinfo' --exclude='test-results' --exclude='playwright-report' \
            .

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Verify required secrets are set
        run: |
          missing=""
          for name in JWT_ACCESS_SECRET JWT_REFRESH_SECRET JWT_CUSTOMER_ACCESS_SECRET JWT_CUSTOMER_REFRESH_SECRET POSTGRES_PASSWORD REDIS_PASSWORD; do
            eval "value=\${${name}}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Refusing to deploy — missing/empty GitHub secrets:$missing"
            exit 1
          fi
        env:
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_CUSTOMER_ACCESS_SECRET: ${{ secrets.JWT_CUSTOMER_ACCESS_SECRET }}
          JWT_CUSTOMER_REFRESH_SECRET: ${{ secrets.JWT_CUSTOMER_REFRESH_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

      - name: Write docker/.env
        run: |
          : > docker.env
          echo "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}" >> docker.env
          echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" >> docker.env
          echo "JWT_CUSTOMER_ACCESS_SECRET=${{ secrets.JWT_CUSTOMER_ACCESS_SECRET }}" >> docker.env
          echo "JWT_CUSTOMER_REFRESH_SECRET=${{ secrets.JWT_CUSTOMER_REFRESH_SECRET }}" >> docker.env
          echo "WEB_ORIGIN=${{ secrets.WEB_ORIGIN }}" >> docker.env
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> docker.env
          echo "NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" >> docker.env
          # Same public domain as NEXT_PUBLIC_SITE_URL — everything lives behind one nginx host in
          # this deploy, and this is what the API embeds into category/banner/logo/editor image
          # URLs. No separate secret to maintain; reusing NEXT_PUBLIC_SITE_URL keeps it from ever
          # drifting out of sync with the domain the site actually runs on.
          echo "API_ORIGIN=${{ secrets.NEXT_PUBLIC_SITE_URL }}" >> docker.env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> docker.env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> docker.env

      - name: Transfer to VPS
        run: |
          scp -i ~/.ssh/deploy_key /tmp/deploy.tar.gz root@${{ secrets.VPS_HOST }}:/opt/asifzone/deploy.tar.gz
          scp -i ~/.ssh/deploy_key docker.env root@${{ secrets.VPS_HOST }}:/opt/asifzone/docker/.env.next

      - name: Build and restart the stack
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} '
            set -e
            cd /opt/asifzone
            tar -xzf deploy.tar.gz && rm deploy.tar.gz
            mv docker/.env.next docker/.env
            docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build
            docker compose -f docker/docker-compose.yml exec -T api npx prisma migrate deploy
            # api/web just got recreated with fresh container IPs, and nginx.conf may have
            # changed too (its ./nginx/nginx.conf mount does not itself trigger a reload) — always
            # restart nginx so it never keeps proxying to a dead container.
            docker compose -f docker/docker-compose.yml restart nginx
          '
