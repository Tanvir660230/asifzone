name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clothing_brand
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clothing_brand?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_CUSTOMER_ACCESS_SECRET: ci-customer-access-secret
      JWT_CUSTOMER_REFRESH_SECRET: ci-customer-refresh-secret
      WEB_ORIGIN: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMe123!
      E2E_STAFF_EMAIL: staff@example.com
      E2E_STAFF_PASSWORD: ChangeMe123!

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # critical (not high) is the actual gate: the remaining high/moderate findings as of this
      # writing are all vendored inside next@15's own optional/internal deps (sharp, postcss) —
      # not reachable via our own dependency pins or pnpm overrides, so a high-level gate would
      # block every PR on something no change in this repo can fix. Re-tighten this once Next.js
      # bumps those internally (check `pnpm audit` — if it's down to 0, drop back to --audit-level high).
      - name: Audit dependencies
        run: pnpm audit --audit-level critical

      - name: Build shared package
        run: pnpm --filter @clothing-brand/shared build

      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy

      # Fails when schema.prisma changed without a matching migration file. Production only runs
      # `migrate deploy`, so a schema edit with no migration passes locally (where `db push` masks
      # it) but breaks the live database. Must run before anything that could `db push`.
      - name: Check schema has no un-migrated changes
        run: pnpm --filter api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Seed admin + demo catalog
        run: pnpm --filter api db:seed

      # The acceptance spec builds products from the starter types (Panjabi, Cap, Shoes, Watch), and
      # the builder's test matrix signs in as a STAFF admin to check what staff can and can't do.
      - name: Seed starter presets + e2e staff account
        run: |
          pnpm --filter api db:seed:presets
          pnpm --filter api exec tsx scripts/create-e2e-staff.ts

      - name: Typecheck API
        run: pnpm --filter api exec tsc --noEmit -p tsconfig.json

      - name: Typecheck web
        run: pnpm --filter web exec tsc --noEmit -p tsconfig.json

      - name: Run API tests
        run: pnpm --filter api test

      - name: Build web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Start API and web servers
        run: |
          pnpm --filter api exec tsx src/server.ts &
          pnpm --filter web start:e2e &
          npx wait-on http://localhost:4000/health http://localhost:3000

      - name: Run Playwright end-to-end tests
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Runs directly on the VPS via a self-hosted runner instead of SSHing in from a hosted
    # runner — Hostinger's network-level DDoS protection was silently dropping connections from
    # GitHub's hosted-runner (Azure) IP ranges, so ssh-keyscan timed out on every deploy. Running
    # on-box removes that network hop entirely. Only the push-to-main-gated `deploy` job uses this
    # label; `test` stays on a hosted runner so PRs (including from forks) never execute on it.
    runs-on: [self-hosted, vps]
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets are set
        run: |
          missing=""
          for name in JWT_ACCESS_SECRET JWT_CUSTOMER_ACCESS_SECRET JWT_CUSTOMER_REFRESH_SECRET POSTGRES_PASSWORD REDIS_PASSWORD; do
            eval "value=\${${name}}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Refusing to deploy — missing/empty GitHub secrets:$missing"
            exit 1
          fi
        env:
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_CUSTOMER_ACCESS_SECRET: ${{ secrets.JWT_CUSTOMER_ACCESS_SECRET }}
          JWT_CUSTOMER_REFRESH_SECRET: ${{ secrets.JWT_CUSTOMER_REFRESH_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

      - name: Write docker/.env
        run: |
          : > docker/.env
          echo "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}" >> docker/.env
          echo "JWT_CUSTOMER_ACCESS_SECRET=${{ secrets.JWT_CUSTOMER_ACCESS_SECRET }}" >> docker/.env
          echo "JWT_CUSTOMER_REFRESH_SECRET=${{ secrets.JWT_CUSTOMER_REFRESH_SECRET }}" >> docker/.env
          echo "WEB_ORIGIN=${{ secrets.WEB_ORIGIN }}" >> docker/.env
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> docker/.env
          echo "NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" >> docker/.env
          # Optional — the api container skips the on-demand revalidate call entirely when this is
          # empty (see product.cache.ts's triggerStorefrontRevalidation), falling back to the
          # storefront's normal ~60s ISR window, so this isn't in the required-secrets check above.
          echo "REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}" >> docker/.env
          # Optional — empty keeps the whole Meta integration inert (the storefront pixel in
          # apps/web/lib/meta-pixel.ts and, since docker-compose.yml reuses this value as the api's
          # META_PIXEL_ID, the server-side Conversions API too), so none of these are in the
          # required-secrets check above. META_ACCESS_TOKEN is server-only — never NEXT_PUBLIC_.
          # META_TEST_EVENT_CODE routes every server event to Events Manager's Test Events tab
          # instead of real reporting: set it only while testing, then delete it.
          echo "NEXT_PUBLIC_META_PIXEL_ID=${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}" >> docker/.env
          echo "META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}" >> docker/.env
          echo "META_API_VERSION=${{ secrets.META_API_VERSION }}" >> docker/.env
          echo "META_TEST_EVENT_CODE=${{ secrets.META_TEST_EVENT_CODE }}" >> docker/.env
          # Optional — empty keeps the TikTok Pixel inert (apps/web/lib/pixels/tiktok.ts). Public id,
          # baked into the web image at build time (docker-compose.yml build args).
          echo "NEXT_PUBLIC_TIKTOK_PIXEL_ID=${{ secrets.NEXT_PUBLIC_TIKTOK_PIXEL_ID }}" >> docker/.env
          # Optional — docker-compose.yml already defaults both to empty, which keeps the Google
          # button/One Tap prompt hidden on both admin and customer login (GoogleButton renders
          # nothing without a client ID) rather than failing, so neither is in the required-secrets
          # check above. GOOGLE_CLIENT_ID (api) and NEXT_PUBLIC_GOOGLE_CLIENT_ID (web build arg)
          # must be the same value — see apps/api/.env.example.
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> docker/.env
          echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" >> docker/.env
          # Same public domain as NEXT_PUBLIC_SITE_URL — everything lives behind one nginx host in
          # this deploy, and this is what the API embeds into category/banner/logo/editor image
          # URLs. No separate secret to maintain; reusing NEXT_PUBLIC_SITE_URL keeps it from ever
          # drifting out of sync with the domain the site actually runs on.
          echo "API_ORIGIN=${{ secrets.NEXT_PUBLIC_SITE_URL }}" >> docker/.env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> docker/.env
          # Phase 12 per-store deployment inputs (non-secret repository variables; docker/deploy.sh refuses to
          # start without SERVER_NAME / SERVER_ALIASES / CERT_NAME / GDRIVE_REMOTE).
          echo "SERVER_NAME=${{ vars.SERVER_NAME }}" >> docker/.env
          echo "SERVER_ALIASES=${{ vars.SERVER_ALIASES }}" >> docker/.env
          echo "CERT_NAME=${{ vars.CERT_NAME }}" >> docker/.env
          echo "GDRIVE_REMOTE=${{ vars.GDRIVE_REMOTE }}" >> docker/.env
          echo "COMPOSE_PROJECT_NAME=${{ vars.COMPOSE_PROJECT_NAME }}" >> docker/.env
          echo "POSTGRES_DB=${{ vars.POSTGRES_DB }}" >> docker/.env
          echo "PAYMENT_GATEWAYS=${{ vars.PAYMENT_GATEWAYS }}" >> docker/.env
          echo "SMS_PROVIDER=${{ vars.SMS_PROVIDER }}" >> docker/.env
          echo "EMAIL_PROVIDER=${{ vars.EMAIL_PROVIDER }}" >> docker/.env
          echo "COURIER_PROVIDER=${{ vars.COURIER_PROVIDER }}" >> docker/.env
          echo "PUSH_PROVIDER=${{ vars.PUSH_PROVIDER }}" >> docker/.env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> docker/.env
          # Optional — docker-compose.yml falls back to a no-op dev mailer (writes to disk instead
          # of sending) when this is empty, so it's not in the required-secrets check above.
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> docker/.env
          echo "RESEND_FROM_ADDRESS=${{ secrets.RESEND_FROM_ADDRESS }}" >> docker/.env
          echo "BULKSMSBD_API_KEY=${{ secrets.BULKSMSBD_API_KEY }}" >> docker/.env
          echo "BULKSMSBD_SENDER_ID=${{ secrets.BULKSMSBD_SENDER_ID }}" >> docker/.env
          # Optional — the web push opt-in toggle (both sending from the api and subscribing from
          # the web build's NEXT_PUBLIC_VAPID_PUBLIC_KEY, see docker-compose.yml) stays hidden while
          # this is empty. Generate a pair with `npx web-push generate-vapid-keys`.
          echo "WEB_PUSH_PUBLIC_KEY=${{ secrets.WEB_PUSH_PUBLIC_KEY }}" >> docker/.env
          echo "WEB_PUSH_PRIVATE_KEY=${{ secrets.WEB_PUSH_PRIVATE_KEY }}" >> docker/.env
          echo "WEB_PUSH_CONTACT_EMAIL=${{ secrets.WEB_PUSH_CONTACT_EMAIL }}" >> docker/.env
          # Optional — docker-compose.yml already defaults STEADFAST_BASE_URL and falls back to a
          # clear "not configured" error on the other two when empty, so none of these are in the
          # required-secrets check above. Without them, "Book with Steadfast" would silently never
          # work in production even though docker-compose.yml has always been wired to accept them.
          echo "STEADFAST_API_KEY=${{ secrets.STEADFAST_API_KEY }}" >> docker/.env
          echo "STEADFAST_SECRET_KEY=${{ secrets.STEADFAST_SECRET_KEY }}" >> docker/.env
          echo "STEADFAST_BASE_URL=${{ secrets.STEADFAST_BASE_URL }}" >> docker/.env
          echo "STEADFAST_WEBHOOK_TOKEN=${{ secrets.STEADFAST_WEBHOOK_TOKEN }}" >> docker/.env
          # Optional — docker-compose.yml already defaults these to empty/false, and the checkout
          # option stays hidden until the admin flips it on in Settings, so neither gateway is in
          # the required-secrets check above. Without them, enabling the toggle would fail every
          # checkout with "could not start the payment session" instead of actually working.
          echo "SSLCOMMERZ_STORE_ID=${{ secrets.SSLCOMMERZ_STORE_ID }}" >> docker/.env
          echo "SSLCOMMERZ_STORE_PASSWORD=${{ secrets.SSLCOMMERZ_STORE_PASSWORD }}" >> docker/.env
          echo "SSLCOMMERZ_IS_LIVE=${{ secrets.SSLCOMMERZ_IS_LIVE }}" >> docker/.env
          echo "EPS_USERNAME=${{ secrets.EPS_USERNAME }}" >> docker/.env
          echo "EPS_PASSWORD=${{ secrets.EPS_PASSWORD }}" >> docker/.env
          echo "EPS_HASH_KEY=${{ secrets.EPS_HASH_KEY }}" >> docker/.env
          echo "EPS_MERCHANT_ID=${{ secrets.EPS_MERCHANT_ID }}" >> docker/.env
          echo "EPS_STORE_ID=${{ secrets.EPS_STORE_ID }}" >> docker/.env
          echo "EPS_SANDBOX=${{ secrets.EPS_SANDBOX }}" >> docker/.env

      # Phase 11 (BD-11.5, docs/DEPLOYMENT.md): backup → verify → build → migrate (before new code serves) → switch →
      # readiness gate (120 s) → restart nginx. Any failing step fails the job with rollback instructions.
      - name: Deploy (backup, migrate, switch, readiness gate)
        run: bash docker/deploy.sh
        env:
          DEPLOY_SHA: ${{ github.sha }}
