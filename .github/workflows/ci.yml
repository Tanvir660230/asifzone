name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clothing_brand
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Production runs with Redis (order/payment locks, cache, queues); without it the concurrency tests lose their locks.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # Prisma's default pool is cores×2+1 = 5 on a 2-core runner — too few for the race tests' parallel transactions
      # (P2028 "Unable to start a transaction"). Locally it is ~33; 20 keeps CI close to that.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clothing_brand?schema=public&connection_limit=20
      REDIS_URL: redis://localhost:6379
      # The e2e web server is a production build (`next start`), which requires an installation id since Phase 1; the API
      # defaults to `test` under NODE_ENV=test, so both name the same installation.
      INSTALL_ID: test
      # Same secret on the API and the web server, as in production: admin writes revalidate the storefront's data cache
      # at once. Without it the storefront serves 60 s old data and e2e checks of a just-saved change fail.
      REVALIDATE_SECRET: ci-revalidate-secret
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_CUSTOMER_ACCESS_SECRET: ci-customer-access-secret
      JWT_CUSTOMER_REFRESH_SECRET: ci-customer-refresh-secret
      WEB_ORIGIN: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMe123!
      E2E_STAFF_EMAIL: staff@example.com
      E2E_STAFF_PASSWORD: ChangeMe123!
      # The second OWNER the finance browser QA approves with (scripts/create-e2e-staff.ts creates it).
      QA_APPROVER_EMAIL: approver@example.com
      QA_APPROVER_PASSWORD: ChangeMe123!

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # critical (not high) is the actual gate: the remaining high/moderate findings as of this
      # writing are all vendored inside next@15's own optional/internal deps (sharp, postcss) —
      # not reachable via our own dependency pins or pnpm overrides, so a high-level gate would
      # block every PR on something no change in this repo can fix. Re-tighten this once Next.js
      # bumps those internally (check `pnpm audit` — if it's down to 0, drop back to --audit-level high).
      - name: Audit dependencies
        run: pnpm audit --audit-level critical

      - name: Build shared package
        run: pnpm --filter @clothing-brand/shared build

      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy

      # Fails when schema.prisma changed without a matching migration file. Production only runs
      # `migrate deploy`, so a schema edit with no migration passes locally (where `db push` masks
      # it) but breaks the live database. Must run before anything that could `db push`.
      - name: Check schema has no un-migrated changes
        run: pnpm --filter api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Seed admin + demo catalog
        run: pnpm --filter api db:seed

      # The acceptance spec builds products from the starter types (Panjabi, Cap, Shoes, Watch), and
      # the builder's test matrix signs in as a STAFF admin to check what staff can and can't do.
      - name: Seed starter presets + e2e staff account
        run: |
          pnpm --filter api db:seed:presets
          pnpm --filter api exec tsx scripts/create-e2e-staff.ts

      - name: Typecheck API
        run: pnpm --filter api exec tsc --noEmit -p tsconfig.json

      - name: Typecheck web
        run: pnpm --filter web exec tsc --noEmit -p tsconfig.json

      - name: Run API tests
        run: pnpm --filter api test

      # Unit + architecture guards for the admin foundations (navigation manifest coverage, shortcut registry, status
      # registry, URL-state grammar) — tests/architecture/*.test.ts and lib/**/*.test.ts.
      - name: Run web unit tests
        run: pnpm --filter web test

      - name: Build web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Start API and web servers
        run: |
          pnpm --filter api exec tsx src/server.ts &
          pnpm --filter web start:e2e &
          npx wait-on http://localhost:4000/health http://localhost:3000

      - name: Run Playwright end-to-end tests
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Deploy — one job per store, each behind its own GitHub Environment with a required reviewer (blueprint tab 13
  # G-2 / DA-2): a push to main deploys nothing until the owner approves that store's job, and approving one store never
  # deploys another. The job is held by GitHub before it reaches the VPS runner, so no step (fetch, backup, migrate)
  # runs unapproved. Always approve the newest run.
  #
  # Runs directly on the VPS via a self-hosted runner (vps-asifzone, /opt/actions-runner) — Hostinger's DDoS protection
  # drops connections from GitHub's hosted-runner IP ranges. Only these push-to-main-gated jobs use the label; `test`
  # stays on a hosted runner so PRs (including from forks) never execute on it.
  #
  # All stores are installations of this one codebase on the same VPS (/opt/asifzone, /opt/nasihamart, /opt/tahafi), each
  # with its own docker/.env kept on the server — the source of truth for its settings. Each job does exactly the manual
  # deploy: fast-forward the install's checkout to this commit, then docker/deploy.sh (backup, migrate, switch, readiness
  # gate). It never writes docker/.env.
  #
  # Separate concurrency groups: one shared group keeps only one waiting job and cancels the older one, which would drop
  # a store's deploy. Builds still run one at a time on the VPS through flock (two at once ran it out of memory).
  deploy-asifzone:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, vps]
    environment: production-asifzone
    concurrency:
      group: deploy-asifzone
      cancel-in-progress: false
    steps:
      - name: Deploy Asif Zone
        working-directory: /opt/asifzone
        run: |
          git fetch origin main
          git merge --ff-only "$DEPLOY_SHA"
          flock /tmp/store-deploy.lock bash docker/deploy.sh
        env:
          DEPLOY_SHA: ${{ github.sha }}

  deploy-nasihamart:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, vps]
    environment: production-nasihamart
    concurrency:
      group: deploy-nasihamart
      cancel-in-progress: false
    steps:
      - name: Deploy Nasihamart
        working-directory: /opt/nasihamart
        run: |
          git fetch origin main
          git merge --ff-only "$DEPLOY_SHA"
          flock /tmp/store-deploy.lock bash docker/deploy.sh
        env:
          DEPLOY_SHA: ${{ github.sha }}

  # The third installation (docs/installations/tahafi.md). Skipped until its first deployment has created /opt/tahafi.
  deploy-tahafi:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, vps]
    environment: production-tahafi
    concurrency:
      group: deploy-tahafi
      cancel-in-progress: false
    steps:
      - name: Deploy Tahafi
        run: |
          if [ ! -d /opt/tahafi ]; then echo "Tahafi is not installed on this server yet — skipping"; exit 0; fi
          cd /opt/tahafi
          git fetch origin main
          git merge --ff-only "$DEPLOY_SHA"
          flock /tmp/store-deploy.lock bash docker/deploy.sh
        env:
          DEPLOY_SHA: ${{ github.sha }}
