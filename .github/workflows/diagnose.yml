name: Diagnose production

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Seed the category tree into production (run once)
        run: |
          scp -i ~/.ssh/deploy_key apps/api/.seed-categories-prod.js root@${{ secrets.VPS_HOST }}:/tmp/seed-categories-prod.js
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} '
            cd /opt/asifzone
            cat /tmp/seed-categories-prod.js | docker compose -f docker/docker-compose.yml exec -T api node
            rm /tmp/seed-categories-prod.js
          '
