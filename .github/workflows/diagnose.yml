name: Diagnose production containers

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Restart nginx (picks up api/web container IPs after they were recreated) and show status
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} '
            cd /opt/asifzone
            docker compose -f docker/docker-compose.yml restart nginx
            sleep 2
            echo "=== docker compose ps ==="
            docker compose -f docker/docker-compose.yml ps
            echo "=== nginx logs (last 20) ==="
            docker compose -f docker/docker-compose.yml logs --tail=20 nginx
          '
