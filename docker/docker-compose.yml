services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clothing_brand
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/clothing_brand?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_CUSTOMER_ACCESS_SECRET: ${JWT_CUSTOMER_ACCESS_SECRET}
      JWT_CUSTOMER_REFRESH_SECRET: ${JWT_CUSTOMER_REFRESH_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Baked directly into the URL for category/banner/logo/editor image uploads (see
      # apps/api/src/modules/uploads/upload.service.ts's processSiteImage) — must be the public
      # origin a browser can actually reach, not an internal Docker hostname. Behind the nginx
      # config here everything lives under one public domain, so this is the same value as
      # NEXT_PUBLIC_SITE_URL below.
      API_ORIGIN: ${API_ORIGIN:-http://localhost:4000}
      UPLOADS_DIR: uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-onboarding@resend.dev}
      BULKSMSBD_API_KEY: ${BULKSMSBD_API_KEY:-}
      BULKSMSBD_SENDER_ID: ${BULKSMSBD_SENDER_ID:-}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_CONTACT_EMAIL: ${WEB_PUSH_CONTACT_EMAIL:-support@example.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
      SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
      SSLCOMMERZ_IS_LIVE: ${SSLCOMMERZ_IS_LIVE:-false}
      EPS_USERNAME: ${EPS_USERNAME:-}
      EPS_PASSWORD: ${EPS_PASSWORD:-}
      EPS_HASH_KEY: ${EPS_HASH_KEY:-}
      EPS_MERCHANT_ID: ${EPS_MERCHANT_ID:-}
      EPS_STORE_ID: ${EPS_STORE_ID:-}
      EPS_SANDBOX: ${EPS_SANDBOX:-true}
      STEADFAST_API_KEY: ${STEADFAST_API_KEY:-}
      STEADFAST_SECRET_KEY: ${STEADFAST_SECRET_KEY:-}
      STEADFAST_BASE_URL: ${STEADFAST_BASE_URL:-https://portal.packzy.com/api/v1}
      STEADFAST_WEBHOOK_TOKEN: ${STEADFAST_WEBHOOK_TOKEN:-}
    volumes:
      - uploads_data:/repo/apps/api/uploads
    ports:
      - "127.0.0.1:4000:4000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        # NEXT_PUBLIC_* vars are inlined into the compiled output at `next build` time, not read
        # from the container's runtime environment — without this here, the `environment:` entry
        # below has zero effect and canonical URLs/og:url/sitemap.xml/robots.txt silently keep
        # whatever this fell back to at image-build time (http://localhost:3000), no matter what's
        # actually configured for the running container.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_CLARITY_ID: ${NEXT_PUBLIC_CLARITY_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_TAWKTO_PROPERTY_ID: ${NEXT_PUBLIC_TAWKTO_PROPERTY_ID:-}
        NEXT_PUBLIC_TAWKTO_WIDGET_ID: ${NEXT_PUBLIC_TAWKTO_WIDGET_ID:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        # Must be the public half of the same pair as the api service's WEB_PUSH_PUBLIC_KEY below
        # (see apps/web/.env.example) — reusing that var here instead of a second secret keeps the
        # two from ever drifting apart.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/uploads:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    # Picks up a cert the certbot service renewed underneath it — the ro bind mount doesn't
    # itself trigger nginx to reread the files, and nginx never reloads on its own otherwise.
    entrypoint: "/bin/sh -c"
    command:
      - "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # No command previously — the image's default entrypoint ("certbot" with no args) tries to
    # auto-configure a web server plugin and fails immediately in this webroot-only setup, so
    # nothing was ever actually renewing. `certbot renew` reuses the authenticator/webroot path
    # already recorded in /etc/letsencrypt/renewal/asifzone.com.conf from the original issuance.
    entrypoint: "/bin/sh -c"
    command:
      - "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  certbot_www:
  certbot_certs:
